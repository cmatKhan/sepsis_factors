name: docs

# Build the pkgdown sites and publish them to the gh-pages branch, one folder per package. It is not run
# on every push. Run it by hand ("Run workflow", optionally naming packages), or merge a pull request
# labelled `docs`; then the packages whose directories the pull request changed are built (all three if
# it changed none of them).
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to build: 'all' or a space-separated list"
        default: all
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged == true
          && contains(github.event.pull_request.labels.*.name, 'docs'))
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.packages }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          all="sepsisfactors sepsisfactorsdb sepsisfactorsapp"
          if [ "$EVENT" = workflow_dispatch ]; then
            chosen=$INPUT
            if [ "$chosen" = all ] || [ -z "$chosen" ]; then chosen=$all; fi
          else
            changed=$(git diff --name-only "$SHA^" "$SHA" | cut -d/ -f1 | sort -u)
            chosen=""
            for pkg in $all; do
              if grep -qx "$pkg" <<<"$changed"; then chosen="$chosen $pkg"; fi
            done
            if [ -z "$chosen" ]; then chosen=$all; fi
          fi
          json=$(printf '%s\n' $chosen | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: ${{ matrix.package }}
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build the site
        working-directory: ${{ matrix.package }}
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ${{ matrix.package }}/docs
          target-folder: ${{ matrix.package }}
          clean: false

  landing:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Publish the landing page
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .github/pages
          clean: false
