name: prek

# Style (styler) and lint (lintr) the files a pull request changes. Run by hand to check every file.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::styler, any::lintr
      - uses: j178/prek-action@v2.0.6
        with:
          extra-args: >-
            ${{ github.event_name == 'pull_request'
            && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
            || '--all-files' }}
